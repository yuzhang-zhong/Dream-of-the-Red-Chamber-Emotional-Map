<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="600" viewBox="0 0 1440 600" role="img" aria-labelledby="title desc">
  <title id="title">红楼梦情绪地景图：从章节进入空间，再沿人物回看命运</title>
  <desc id="desc">阅读路径示意图，不是应用截图。左侧介绍以空间阅读一百二十回红楼梦，右侧以潇湘馆、怡红院、蘅芜苑与太虚幻境的抽象轨道表现文学空间，底部列出章节、地点、人物与关系四步阅读路径。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#181111"/><stop offset=".5" stop-color="#241417"/><stop offset="1" stop-color="#100d13"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#9d5363" stop-opacity=".28"/><stop offset="1" stop-color="#9d5363" stop-opacity="0"/></radialGradient>
    <linearGradient id="line"><stop stop-color="#6fa8a6"/><stop offset=".5" stop-color="#c8a45d"/><stop offset="1" stop-color="#8d72b8"/></linearGradient>
  </defs>
  <rect width="1440" height="600" rx="20" fill="url(#bg)"/>
  <rect x="18" y="18" width="1404" height="564" rx="13" fill="none" stroke="#c8a45d" stroke-opacity=".23"/>
  <circle cx="1110" cy="240" r="310" fill="url(#halo)"/>
  <g fill="none" stroke="#c8a45d" stroke-opacity=".09">
    <path d="M820 60v330M900 60v330M980 60v330M1060 60v330M1140 60v330M1220 60v330M1300 60v330"/>
    <path d="M790 100h560M790 180h560M790 260h560M790 340h560"/>
  </g>
  <g font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif">
    <text x="68" y="74" font-size="15" letter-spacing="4" fill="#c8a45d">A LITERARY LANDSCAPE IN MOTION</text>
    <text x="68" y="156" font-family="'Noto Serif CJK SC','Songti SC',serif" font-size="54" fill="#f7ecd3">红楼梦情绪地景图</text>
    <text x="70" y="201" font-size="19" fill="#cdbca1">Dream of the Red Chamber Emotional Landscape</text>
    <text x="70" y="267" font-size="27" fill="#efdfc1">贾府不是背景，是一套情绪系统。</text>
    <text x="70" y="309" font-size="18" fill="#b9aa93">沿一百二十回的起伏，看见空间、人物与命运。</text>
    <text x="70" y="365" font-size="13" letter-spacing="2" fill="#9c8b79">阅读路径示意 · 非应用截图 / CONCEPTUAL READING FLOW</text>
    <g fill="none" stroke-width="1.3">
      <ellipse cx="1085" cy="229" rx="203" ry="130" transform="rotate(-17 1085 229)" stroke="#c8a45d" stroke-opacity=".32"/>
      <ellipse cx="1085" cy="229" rx="170" ry="92" transform="rotate(22 1085 229)" stroke="#c76b7a" stroke-opacity=".4"/>
      <path d="M914 170Q1080 50 1260 210M914 170Q1010 330 1160 330M1260 210Q1200 290 1160 330" stroke="url(#line)" stroke-opacity=".75"/>
      <path d="M914 170L1060 255L1260 210M1060 255L1160 330" stroke="#e0cda4" stroke-opacity=".3" stroke-dasharray="4 7"/>
    </g>
    <g>
      <circle cx="914" cy="170" r="17" fill="#6fa8a6" fill-opacity=".12"/><circle cx="914" cy="170" r="5" fill="#6fa8a6"/>
      <text x="887" y="138" font-size="20" fill="#8fc4c1">潇湘馆</text>
      <circle cx="1060" cy="255" r="23" fill="#c76b7a" fill-opacity=".13"/><circle cx="1060" cy="255" r="7" fill="#c76b7a"/>
      <text x="1018" y="220" font-size="22" fill="#e5a4af">怡红院</text>
      <circle cx="1260" cy="210" r="17" fill="#d8d2c4" fill-opacity=".12"/><circle cx="1260" cy="210" r="5" fill="#d8d2c4"/>
      <text x="1234" y="178" font-size="20" fill="#d8d2c4">蘅芜苑</text>
      <circle cx="1160" cy="330" r="17" fill="#8d72b8" fill-opacity=".16"/><circle cx="1160" cy="330" r="5" fill="#aa8ad5"/>
      <text x="1192" y="338" font-size="20" fill="#baa3dc">太虚幻境</text>
    </g>
    <path d="M68 414H1372" stroke="#c8a45d" stroke-opacity=".25"/>
    <g font-size="14" fill="#c8a45d" letter-spacing="2"><text x="70" y="456">01 / CHAPTER</text><text x="410" y="456">02 / PLACE</text><text x="750" y="456">03 / CHARACTER</text><text x="1090" y="456">04 / CONTEXT</text></g>
    <g font-size="25" fill="#f1e3cb"><text x="70" y="499">选一回书</text><text x="410" y="499">进入发光的地点</text><text x="750" y="499">循人物去向</text><text x="1090" y="499">回看关系与兴衰</text></g>
    <g font-size="16" fill="#aa9b86"><text x="70" y="536">拖动 · 播放 · 暂停</text><text x="410" y="536">热区 · 空间注解</text><text x="750" y="536">地点分布 · 关键章节</text><text x="1090" y="536">时间线 · 关系附录</text></g>
    <g fill="#c8a45d" fill-opacity=".65"><path d="m350 484 9 7-9 7z"/><path d="m690 484 9 7-9 7z"/><path d="m1030 484 9 7-9 7z"/></g>
  </g>
</svg>
